# LUNA's AI server on Cloudflare Workers (free plan). Deploy with: bash server/deploy.sh
name = "luna-ai"
main = "index.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Fastest first (about 1.2-2 s each). The free tier allows about 20 questions per model per day,
# so LUNA moves down the list as each one runs out; the slower big models are the last resort.
MODELS = "gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest,gemini-3-flash-preview,gemini-3.1-flash-lite-preview,gemini-flash-latest,gemini-3.5-flash,gemini-3.6-flash,gemini-3.7-flash"

# A tiny free key-value store that remembers which models are out of free quota until when,
# shared by every copy of the server (so none of them keeps asking a model that has run out).
# `wrangler deploy` creates it the first time and writes its id here.
[[kv_namespaces]]
binding = "STATE"

[observability]
enabled = true
