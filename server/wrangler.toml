# LUNA's AI server on Cloudflare Workers (free plan). Deploy with: bash server/deploy.sh
name = "luna-ai"
main = "index.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Tried in order. Each model has its own free daily limit, so more models = more answers per day.
MODELS = "gemini-flash-latest,gemini-flash-lite-latest,gemini-3-flash-preview"

[observability]
enabled = true
